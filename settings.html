<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings · CRM Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-page="settings">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <i data-lucide="layout-dashboard" class="brand-icon"></i>
        <span class="brand-text">CRM Platform</span>
      </div>
      <nav class="sidebar-nav" aria-label="Primary navigation">
        <a href="index.html" class="nav-link" data-nav="dashboard">
          <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
        </a>
        <a href="leads.html" class="nav-link" data-nav="leads">
          <i data-lucide="kanban"></i><span>Leads</span>
        </a>
        <a href="contacts.html" class="nav-link" data-nav="contacts">
          <i data-lucide="users"></i><span>Contacts</span>
        </a>
        <a href="analytics.html" class="nav-link" data-nav="analytics">
          <i data-lucide="bar-chart-3"></i><span>Analytics</span>
        </a>
        <a href="settings.html" class="nav-link" data-nav="settings">
          <i data-lucide="settings"></i><span>Settings</span>
        </a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <i data-lucide="menu"></i>
        </button>
        <h1 class="page-title">Settings</h1>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </button>
          <div class="user-profile">
            <span class="avatar-initials">AD</span>
            <span class="user-name">Admin</span>
          </div>
        </div>
      </header>

      <main class="page-content">
        <p class="page-description">CRM platform settings and user profile configuration.</p>

        <section class="settings-panels">
          <div class="panel">
            <h2>User Profile</h2>
            <form id="profileForm" class="settings-form">
              <label for="profileName">Full Name</label>
              <input type="text" id="profileName" name="profileName" value="Admin">
              <label for="profileEmail">Email</label>
              <input type="email" id="profileEmail" name="profileEmail" value="admin@crmplatform.com">
              <button type="submit" class="btn-primary">Save Profile</button>
              <p id="profileSaveStatus" class="save-status" role="status"></p>
            </form>
          </div>
          <div class="panel">
            <h2>Preferences</h2>
            <label class="toggle-row">
              <span>Email notifications</span>
              <input type="checkbox" id="emailNotifications" checked>
            </label>
            <label class="toggle-row">
              <span>Dark mode</span>
              <input type="checkbox" id="darkModeToggle">
            </label>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
