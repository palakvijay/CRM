<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · CRM Platform</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js" defer></script>
</head>
<body data-page="dashboard">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <i data-lucide="layout-dashboard" class="brand-icon"></i>
        <span class="brand-text">CRM Platform</span>
      </div>
      <nav class="sidebar-nav" aria-label="Primary navigation">
        <a href="index.html" class="nav-link" data-nav="dashboard">
          <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
        </a>
        <a href="leads.html" class="nav-link" data-nav="leads">
          <i data-lucide="kanban"></i><span>Leads</span>
        </a>
        <a href="contacts.html" class="nav-link" data-nav="contacts">
          <i data-lucide="users"></i><span>Contacts</span>
        </a>
        <a href="analytics.html" class="nav-link" data-nav="analytics">
          <i data-lucide="bar-chart-3"></i><span>Analytics</span>
        </a>
        <a href="settings.html" class="nav-link" data-nav="settings">
          <i data-lucide="settings"></i><span>Settings</span>
        </a>
      </nav>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
          <i data-lucide="menu"></i>
        </button>
        <h1 class="page-title">Dashboard</h1>
        <div class="topbar-actions">
          <button class="icon-btn" aria-label="Notifications">
            <i data-lucide="bell"></i>
          </button>
          <div class="user-profile">
            <span class="avatar-initials">AD</span>
            <span class="user-name">Admin</span>
          </div>
        </div>
      </header>

      <main class="page-content">
        <p class="page-description">Top metrics, recent activity feed, and quick links.</p>

        <section class="metrics-grid" id="metricsGrid" aria-label="Key metrics">
          <article class="metric-card" data-metric="totalRevenue">
            <h2>Total Revenue</h2>
            <p class="metric-value">—</p>
          </article>
          <article class="metric-card" data-metric="activePipeline">
            <h2>Active Pipeline</h2>
            <p class="metric-value">—</p>
          </article>
          <article class="metric-card" data-metric="winRate">
            <h2>Win Rate</h2>
            <p class="metric-value">—</p>
          </article>
        </section>

        <section class="dashboard-panels">
          <div class="panel">
            <h2>Recent Activity</h2>
            <ul id="recentActivity" class="activity-list"></ul>
          </div>
          <div class="panel">
            <h2>Quick Links</h2>
            <div class="quick-links">
              <a href="leads.html" class="quick-link"><i data-lucide="kanban"></i>Go to Leads</a>
              <a href="contacts.html" class="quick-link"><i data-lucide="users"></i>Go to Contacts</a>
              <a href="analytics.html" class="quick-link"><i data-lucide="bar-chart-3"></i>Go to Analytics</a>
            </div>
          </div>
        </section>

        <section class="panel pending-tasks-widget" id="widget-pending-tasks" aria-labelledby="pendingTasksHeading">
          <div class="widget-heading">
            <h2 id="pendingTasksHeading">Pending Tasks</h2>
            <span class="pending-task-count">0 pending</span>
          </div>
          <ul class="pending-task-list"></ul>
        </section>
      </main>
    </div>
  </div>

  <script src="js/app.js" defer></script>
</body>
</html>
